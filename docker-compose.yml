version: '3.8'

services:
  client:
    container_name: kubeguardian-client
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "${KUBEGUARDIAN_CLIENT_PORT:-3000}:4173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - server
    networks:
      - kubeguardian-isolated-network

  server:
    container_name: kubeguardian-server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "${KUBEGUARDIAN_SERVER_PORT:-8000}:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - MONGODB_URI=mongodb://kubeguardian_admin:KubeGuardianSecret2026!@mongodb:27017/kubeguardian?authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=kubeguardian-devsecops-super-secure-jwt-key
      - FRONTEND_URL=http://localhost:3000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - mongodb
      - redis
    networks:
      - kubeguardian-isolated-network

  mongodb:
    container_name: kubeguardian-mongodb
    image: mongo:7.0
    ports:
      - "${KUBEGUARDIAN_MONGO_PORT:-27018}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=kubeguardian_admin
      - MONGO_INITDB_ROOT_PASSWORD=KubeGuardianSecret2026!
      - MONGO_INITDB_DATABASE=kubeguardian
    volumes:
      - kubeguardian_mongodb_data:/data/db
      - ./infrastructure/database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - kubeguardian-isolated-network

  redis:
    container_name: kubeguardian-redis
    image: redis:7-alpine
    ports:
      - "${KUBEGUARDIAN_REDIS_PORT:-6389}:6379"
    volumes:
      - kubeguardian_redis_data:/data
    networks:
      - kubeguardian-isolated-network

  prometheus:
    container_name: kubeguardian-prometheus
    image: prom/prometheus:latest
    ports:
      - "${KUBEGUARDIAN_PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - kubeguardian_prometheus_data:/prometheus
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - kubeguardian-isolated-network

  grafana:
    container_name: kubeguardian-grafana
    image: grafana/grafana:latest
    ports:
      - "${KUBEGUARDIAN_GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=kubeguardian
      - GF_SECURITY_ADMIN_PASSWORD=KubeGuardianSecureGrafana!
    volumes:
      - kubeguardian_grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - kubeguardian-isolated-network

volumes:
  kubeguardian_mongodb_data:
    name: kubeguardian_mongodb_data
  kubeguardian_redis_data:
    name: kubeguardian_redis_data
  kubeguardian_prometheus_data:
    name: kubeguardian_prometheus_data
  kubeguardian_grafana_data:
    name: kubeguardian_grafana_data

networks:
  kubeguardian-isolated-network:
    name: kubeguardian-isolated-network
    driver: bridge
